# Signs in only if the app is showing the sign-in screen.
#
# Flows must not depend on the order the runner picks: `00-launch` clears state
# on purpose, so any flow can find itself signed out. Every authenticated flow
# starts by running this, which makes each one independently runnable — the
# property you want at 2am when only one of them is failing.
appId: app.nutriai.mobile
---
- runFlow:
    when:
      visible:
        id: 'login-screen'
    commands:
      - tapOn: 'Email'
      - inputText: ${EMAIL}
      - tapOn: 'Password'
      - inputText: ${PASSWORD}
      - tapOn: 'Sign in'

      # Google Password Manager offers to save the credentials right after a
      # successful sign-in, and its sheet covers the whole screen — so the
      # assertion below fails on a device where the app signed in perfectly.
      # It only appears once the device has an active Google account, which is
      # why the suite passed for months and then started failing without any
      # app change.
      - runFlow:
          when:
            visible: 'Save password.*'
          commands:
            - tapOn: 'Not now'

      - extendedWaitUntil:
          visible: 'Quick log .*'
          timeout: 20000
