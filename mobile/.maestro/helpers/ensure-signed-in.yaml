# Signs in only if the app is showing the sign-in screen.
#
# Flows must not depend on the order the runner picks: `00-launch` clears state
# on purpose, so any flow can find itself signed out. Every authenticated flow
# starts by running this, which makes each one independently runnable — the
# property you want at 2am when only one of them is failing.
#
# ── Google Password Manager ───────────────────────────────────────────────
# On any device signed in to a Google account, GPM interrupts this flow twice,
# and both times its sheet covers the screen so the app underneath is fine
# while the test fails:
#
#   1. "Use your saved password for NutriAI?" — autofill, on field focus,
#      before anything is typed.
#   2. "Save password to Google Password Manager?" — after a successful
#      sign-in.
#
# Neither existed until the emulator had a Google account, which is why the
# suite passed for months and then began failing with no app change. The
# reliable cure is to turn the autofill service off on the test device:
#
#   adb shell settings put secure autofill_service null
#
# These guards stay anyway, because the next device will not have had that
# done to it.
appId: app.nutriai.mobile
---
- runFlow:
    when:
      visible:
        id: 'login-screen'
    commands:
      - tapOn: 'Email'
      - runFlow:
          when:
            visible: 'Use your saved password.*'
          commands:
            - tapOn: 'No thanks'
      - inputText: ${EMAIL}

      - tapOn: 'Password'
      - runFlow:
          when:
            visible: 'Use your saved password.*'
          commands:
            - tapOn: 'No thanks'
      - inputText: ${PASSWORD}

      - tapOn: 'Sign in'

      - runFlow:
          when:
            visible: 'Save password.*'
          commands:
            - tapOn: 'Not now'

      - extendedWaitUntil:
          visible: 'Quick log .*'
          timeout: 20000
