# Smoke test: the app starts and gets far enough to ask who you are.
#
# Needs no account, so it's the one flow that runs anywhere — a fresh emulator,
# CI, a colleague's machine — and it catches the failures that matter most:
# a bundle that won't load, a native module that crashes on boot, a blank
# first screen.
appId: app.nutriai.mobile
---
- clearState
- launchApp
- assertVisible: 'NutriAI'
- assertVisible:
    id: 'login-screen'
- assertVisible:
    text: 'Email'
- assertVisible:
    text: 'Sign in'
# The route a new person takes. Asserted by its call to action rather than the
# whole card's wording, so a copy tweak above it doesn't fail the smoke test —
# but the button existing at all is the promise worth keeping.
- assertVisible: 'Create an account'
