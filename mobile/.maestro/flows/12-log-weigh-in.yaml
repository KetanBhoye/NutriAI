# Logging a weigh-in and step count from the Plan tab.
#
# The weigh-in is the one number a user cannot reconstruct later, and the whole
# adaptive plan is fitted to those readings — so this asserts it actually
# reached the server, not merely that the screen said something encouraging.
#
# Safe to re-run: `POST /api/activity` upserts per day.
appId: app.nutriai.mobile
---
- launchApp
- runFlow: ../helpers/ensure-signed-in.yaml
- tapOn: 'Plan'
- assertVisible: 'PLAN'

- tapOn:
    id: 'log-weight'
- inputText: '71.2'
- tapOn:
    id: 'log-steps'
- inputText: '6500'

- scrollUntilVisible:
    element:
      text: 'Log for today'
    direction: DOWN
- tapOn: 'Log for today'

# "Saved for today." means it synced; "Saved on this device" means it's still
# queued. Only the first is acceptable with a working connection.
#
# Scrolled to, not merely asserted: the message renders *below* the button that
# was just tapped (goals.tsx), so at the moment it appears it is one line under
# the fold. Asserting directly fails on a screen where the save worked.
- scrollUntilVisible:
    element:
      text: 'Saved for today.'
    direction: DOWN
    timeout: 30000
- assertNotVisible: "The server wouldn't accept that weigh-in.*"

# And the readout picked it up, which only happens after a reload from the API.
#
# Reached by relaunching rather than scrolling back up: the Plan tab is about
# five screens tall and grows with what earlier flows logged, so "scroll up far
# enough" is a race against page length that this flow kept losing. A cold
# start puts the page at the top deterministically — and asserts something
# stronger while it's there, since the number now has to survive a restart,
# which only happens if the server really has it.
- stopApp
- launchApp:
    clearState: false
- tapOn: 'Plan'

# The weight, from the CURRENT tile — server-derived, so seeing it after a
# restart is the proof that the weigh-in landed rather than sat in the queue.
- extendedWaitUntil:
    visible: 'CURRENT'
    timeout: 30000
# Wrapped in .* — Maestro text selectors match the whole string, and the tile
# renders the number with its unit alongside.
- assertVisible: '.*71\.2.*'

# Steps are asserted from the chart, NOT from the top-right tile. That tile
# shows "STEPS TODAY" only when no exercise session exists — log one and it
# becomes "ACTIVITY TODAY · 45 min badminton" instead. Asserting it there made
# this flow depend on whether 13-log-exercise-session had run first, which the
# runner gives no guarantees about.
- scrollUntilVisible:
    element:
      text: 'Daily steps'
    direction: DOWN
    timeout: 45000

# Steps are deliberately NOT asserted by value here.
#
# The chart header shows the day's figure on an account with one day of steps
# and a multi-day *average* once there is history, so asserting '6,500' only
# passed because the test account was nearly empty — it broke the moment the
# dev database held two weeks of data, which is the state every real user is
# in. Reading it back from the input does not work either: that is an entry
# form and it resets to a placeholder after saving.
#
# The write itself is already covered above: steps and weight are saved in the
# same request, and "Saved for today." means the server accepted it rather
# than the queue holding it. What is left worth checking is that the chart
# renders at all with real history behind it — the failure mode being a plot
# that throws or draws nothing once there is more than one point.
- scrollUntilVisible:
    element:
      text: 'Daily steps'
    direction: DOWN
    timeout: 45000
- assertVisible: 'Daily steps'
- assertVisible: 'today'
